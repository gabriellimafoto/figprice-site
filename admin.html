<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel · FigPrice</title>
<meta name="theme-color" content="#1a120d">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a120d;--card:#241912;--fundo:#130c08;--ink:#f1e9dd;--muted:#bfae99;--line:#4a382b;--ouro:#e2b54a;--verde:#6cc0b2;--vermelho:#e2584a;color-scheme:dark}
*{box-sizing:border-box}
html{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;font-size:16px;line-height:1.45;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
main{width:min(1200px,100% - 32px);margin:0 auto;padding:24px 0 60px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:1.8rem}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.login{max-width:420px;margin:60px auto}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--fundo);color:var(--ink);font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.ouro{background:var(--ouro);border-color:var(--ouro);color:#2a2420}
.btn.pq{min-height:34px;padding:5px 11px;font-size:.85rem}
.btn.perigo{color:var(--vermelho);border-color:var(--vermelho)}
.btn:disabled{opacity:.5}
.erro{color:var(--vermelho);min-height:1.2em;margin-top:10px}
.nota{color:var(--muted);font-size:.9rem}
.stats{margin-bottom:18px}
.resumo-total{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.resumo-total b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2.6rem;line-height:1}
.resumo-total span{color:var(--muted)}
.resumo-linha{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.resumo-linha span{background:var(--fundo);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:.9rem}
.resumo-linha span b{margin-right:4px}
.resumo-linha .alerta{border-color:var(--ouro);color:var(--ouro)}
.carregando{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
.barra input{flex:1;min-width:200px}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#11201e}
.lista{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
@media (max-width:420px){.lista{grid-template-columns:1fr}}
.lic{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.lic .cab{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.lic .nm{font-weight:700;font-size:1.05rem;line-height:1.25;word-break:break-word}
.lic .em{color:var(--muted);font-size:.8rem;word-break:break-all}
.lic .info{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:.82rem}
.aps{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink);white-space:nowrap}
.aps svg{width:14px;height:14px}
.aps.cheio{color:var(--ouro)}
.tag{display:inline-block;font-size:.75rem;font-weight:800;padding:3px 9px;border-radius:20px;background:#3a2a20;color:var(--muted)}
.hist{margin-top:10px;border-top:1px solid #4a382b;padding-top:8px;font-size:.85rem}
.hist-l{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:6px 0;border-bottom:1px dashed #3a2a20}
.hist-l span{color:#bfae99;grid-row:span 2}
.hist-l small{color:#bfae99}
.idioma{margin:6px 0 2px;font-size:.88rem;color:var(--muted)}
.idioma.fora{display:inline-block;padding:6px 10px;border-radius:10px;border:1px solid var(--ouro);color:var(--ouro);font-weight:700}
.hist-l.erro b,.hist-l.erro small{color:var(--vermelho,#e57373)}
.tag.pro{background:var(--ouro);color:#2a2420;vertical-align:2px}
.tag.pais{background:#1d3550;color:#cfe3ff;vertical-align:2px}
.tag.basico{background:#4a4540;color:#d8d2ca;vertical-align:2px}
.resumo-total{cursor:pointer;border-radius:12px;padding:2px 6px;margin:-2px -6px}
.resumo-total[aria-pressed="true"] span{color:var(--verde)}
.resumo-linha button{background:var(--fundo);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font:inherit;font-size:.9rem;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s}
.resumo-linha button b{margin-right:4px}
.resumo-linha button.alerta{border-color:var(--ouro);color:var(--ouro)}
.resumo-linha button[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#11201e}
.resumo-linha button:disabled{opacity:.45;cursor:default}
.lic{position:relative;padding-bottom:22px}
.seta-hist{position:absolute;right:8px;bottom:4px;width:30px;height:24px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:8px}
.seta-hist svg{width:18px;height:18px;transition:transform .25s}
.seta-hist[aria-expanded="true"] svg{transform:rotate(180deg)}
.seta-hist:hover{background:var(--fundo)}
.btn.ouro-l{color:var(--ouro);border-color:var(--ouro)}
.tag.ativo{background:#1f4a43;color:#bfeee5}.tag.bloqueado{background:#5a1f19;color:#ffc9c2}.tag.vencida{background:#5a4513;color:#f3d48b}.tag.reembolsada{background:#2a3550;color:#c3d3ff}.tag.contestada{background:#4a1f3f;color:#ffc2ec}
.lic{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .12s,border-color .2s}
.lic:active{transform:scale(.99)}
.lic.segurando{border-color:var(--vermelho);transition:border-color .5s}
.lic .mais{color:var(--muted);font-size:1.3rem;line-height:1;margin-left:4px}
.lista.velha{opacity:.45;pointer-events:none;filter:grayscale(.4);transition:opacity .2s}
.carregando{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:8px;width:max-content;margin:0 auto 10px;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--ouro);color:var(--ouro);font-weight:700;font-size:.88rem}
.carregando::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--ouro);border-top-color:transparent;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#dlgAcoes{padding:0;overflow:hidden}
.ac-topo{padding:18px 20px 10px;border-bottom:1px solid var(--line)}
.ac-topo b{display:block;font-size:1.05rem}.ac-topo small{color:var(--muted);word-break:break-all}
.ac-corpo{padding:6px 12px 14px;max-height:70vh;overflow:auto}
.ac-div{display:flex;align-items:center;gap:10px;margin:16px 6px 6px;color:var(--ouro);font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.ac-div::after{content:"";flex:1;height:1px;background:var(--line)}
.ac-div:first-child{margin-top:8px}
.ac-grupo{background:var(--fundo);border:1px solid var(--line);border-radius:14px;padding:2px}
.teste-l{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--verde)}
.teste-l.fim{color:var(--muted)}
#abrirReemb{position:relative}
#abrirReemb .n{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--vermelho);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center}
.re-item{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:var(--fundo)}
.re-item b{display:block}.re-item small{color:var(--muted);display:block}
.re-item .re-mot{margin:8px 0 0;font-size:.88rem}
.re-item .btns{display:flex;gap:8px;margin-top:10px}.re-item .btns .btn{flex:1}
.re-st{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:12px;margin-left:6px;vertical-align:2px}
.re-st.pendente{background:var(--ouro);color:#2a2420}.re-st.devolvido{background:var(--verde);color:#11201e}.re-st.recusado{background:#3a2a20;color:var(--muted)}
.re-prazo{color:var(--vermelho);font-weight:700}
.ac-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border:0;border-radius:12px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ac-item:hover,.ac-item:active{background:var(--fundo)}
.ac-item svg{width:20px;height:20px;flex:none;color:var(--muted)}
.ac-item span{flex:1}.ac-item small{color:var(--muted);font-size:.8rem}
.ac-item.ouro svg,.ac-item.ouro span{color:var(--ouro)}
.ac-item.perigo,.ac-item.perigo svg{color:var(--vermelho)}
.ac-sep{border-top:1px solid var(--line);margin:12px 0 4px}
.ac-conf{padding:18px 20px}
.ac-conf p{margin:6px 0 16px;color:var(--muted)}
.ac-conf .btns{display:flex;gap:8px}.ac-conf .btns .btn{flex:1}
.btn.vermelho{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.acoes{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.acoes .btn.pq{min-height:30px;padding:4px 10px;font-size:.8rem}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(440px,100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
html:has(dialog[open]),html:has(dialog[open]) body{overflow:hidden}
dialog,.ac-corpo{overscroll-behavior:contain}
.ac-topo{position:relative;padding-right:56px!important}
.ac-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--fundo);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.ac-x:hover{border-color:var(--ouro);color:var(--ouro)}
.dlg-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fechar{background:none;border:0;color:var(--muted);font-size:1.6rem;line-height:1;cursor:pointer;padding:4px 8px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:10px}
.check input{width:auto}
</style>
</head>
<body>
<main>
  <section id="telaLogin" class="login card">
    <h1>Painel FigPrice</h1>
    <p class="nota">Acesso só para o administrador. Um código de 6 números chega no seu e-mail.</p>
    <div id="passo1">
      <label for="lEmail">E-mail do administrador</label>
      <input id="lEmail" type="email" autocomplete="email" value="gbiel2008@hotmail.com">
      <button class="btn ouro" style="width:100%;margin-top:14px" id="pedir">Enviar código</button>
    </div>
    <div id="passo2" hidden>
      <label for="lCodigo">Código recebido no e-mail</label>
      <input id="lCodigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
      <label class="check"><input type="checkbox" id="lLembrar" checked> Lembrar este computador por 30 dias</label>
      <button class="btn ouro" style="width:100%;margin-top:14px" id="entrar">Entrar</button>
      <p class="nota">Não chegou? Olhe a caixa de spam.</p>
    </div>
    <p class="erro" id="lErro" role="alert"></p>
  </section>

  <section id="telaPainel" hidden>
    <div class="topo"><h1>Licenças</h1><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn ouro" id="abrirNova">+ Nova licença</button><button class="btn" id="abrirReemb">Reembolsos e motivos</button><button class="btn" id="atualizar">Atualizar</button><button class="btn" id="sair">Sair</button></div></div>
    <p class="carregando" id="carregando" hidden>Atualizando…</p>
    <div class="stats card" id="stats"></div>
    <dialog id="dlgNova">
      <div class="dlg-cab"><h2>Nova licença</h2><button class="fechar" id="fecharNova" aria-label="Fechar">×</button></div>
      <label for="nNome">Nome</label><input id="nNome" type="text" placeholder="Nome do cliente">
      <label for="nEmail">E-mail</label><input id="nEmail" type="email" placeholder="cliente@email.com">
      <label for="nPlano">Acesso</label><select id="nPlano"><option value="0">Vitalício</option><option value="7">7 dias</option><option value="30">30 dias</option><option value="90">90 dias</option><option value="365">1 ano</option></select>
      <label class="check"><input type="checkbox" id="nEnviar" checked> Mandar o e-mail com o código para a pessoa</label>
      <button class="btn ouro" style="width:100%;margin-top:16px" id="criar">Criar licença</button>
    </dialog>
    <dialog id="dlgAcoes"></dialog>
    <dialog id="dlgReemb"></dialog>
    <div class="barra">
      <input id="busca" type="search" placeholder="Buscar por e-mail ou nome">

    </div>
    <div class="lista" id="lista"></div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>
<script>
const API = "https://script.google.com/macros/s/AKfycbw4T6NZEemGmCQf1r_PoYeMVFq57wtigSd-XYc711VnBA5y58V0UBnkNgGv0e1bOqFixw/exec";
const DIA = 864e5;
let token = localStorage.getItem("ff_admin") || sessionStorage.getItem("ff_admin"), dados = [], filtro = localStorage.getItem("ff_admin_filtro") || "todas";
function esquecer(){ localStorage.removeItem("ff_admin"); sessionStorage.removeItem("ff_admin"); token = null; }
const $ = id => document.getElementById(id);
function toast(t){ const e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 2600); }
async function api(params){
  const r = await fetch(API + "?" + new URLSearchParams(Object.assign({token: token || ""}, params)));
  const j = await r.json();
  if (j.sair){ esquecer(); mostrar(); }
  return j;
}
function mostrar(){
  $("telaLogin").hidden = !!token; $("telaPainel").hidden = !token;
  if (!token) return;
  try{ const c = JSON.parse(localStorage.getItem("ff_admin_cache") || "null"); if (Array.isArray(c) && !dados.length){ dados = c; desenhar(); } }catch(_){}
  carregar();
}
$("pedir").onclick = async () => {
  $("lErro").textContent = ""; $("pedir").disabled = true;
  try{ const j = await api({acao: "admin_pedir", email: $("lEmail").value.trim().toLowerCase()});
    if (j.ok){ $("passo1").hidden = true; $("passo2").hidden = false; $("lCodigo").focus(); } else $("lErro").textContent = j.erro; }
  catch(e){ $("lErro").textContent = "Sem conexão. Tente de novo."; }
  $("pedir").disabled = false;
};
$("entrar").onclick = async () => {
  $("lErro").textContent = "";
  const lembrar = $("lLembrar").checked;
  try{ const j = await api({acao: "admin_entrar", codigo: $("lCodigo").value.trim(), lembrar: lembrar ? "1" : "0"});
    if (j.ok){ token = j.token; (lembrar ? localStorage : sessionStorage).setItem("ff_admin", token); mostrar(); } else $("lErro").textContent = j.erro; }
  catch(e){ $("lErro").textContent = "Sem conexão. Tente de novo."; }
};
$("lCodigo").onkeydown = e => { if (e.key === "Enter") $("entrar").click(); };
$("sair").onclick = async () => { try{ await api({acao: "admin_sair"}); }catch(_){} esquecer(); try{ localStorage.removeItem("ff_admin_cache"); }catch(_){} mostrar(); };
$("atualizar").onclick = () => carregar();
function situacao(l){
  const st = String(l.status).toLowerCase();
  if (st === "reembolsado") return "reembolsada"; /* v22: o motivo do bloqueio aparece no selo */
  if (st === "contestado") return "contestada";
  if (st !== "ativo") return "bloqueado";
  if (l.validoAte && Date.now() > l.validoAte) return "vencida";
  return "ativo";
}
const dataBR = t => t ? new Date(t).toLocaleDateString("pt-BR") : "";
async function carregar(){
  $("carregando").hidden = false; if (dados.length) $("lista").classList.add("velha");
  try{ const j = await api({acao: "admin_listar"}); if (!j.ok){ toast(j.erro || "Erro ao carregar"); return; } dados = j.licencas; try{ localStorage.setItem("ff_admin_cache", JSON.stringify(dados)); }catch(_){} desenhar(); }
  catch(e){ toast("Sem conexão com a planilha"); }
  finally{ $("carregando").hidden = true; $("lista").classList.remove("velha"); carregarReemb(); carregarFeedback().catch(() => {}); }
}
const FILTROS = [["todas", "Todas"], ["ativo", "Ativas"], ["vencendo", "Vencendo em 7 dias"], ["vencida", "Vencidas"], ["bloqueado", "Bloqueadas"]];
let FILTRO_FN = null;
function desenhar(){
  localStorage.setItem("ff_admin_filtro", filtro); /* lembra o último filtro escolhido */
  const ativos = dados.filter(l => situacao(l) === "ativo");
  const vencendo = ativos.filter(l => l.validoAte && l.validoAte - Date.now() < 7 * DIA);
  /* (09/11) os números do topo SÃO os filtros: tocar filtra a lista; tocar de novo volta para todas */
  const F = {
    ativo: l => situacao(l) === "ativo",
    pro: l => !!l.pro && situacao(l) === "ativo",
    basico: l => !l.pro && situacao(l) === "ativo",
    vitalicia: l => situacao(l) === "ativo" && !l.validoAte,
    assinatura: l => situacao(l) === "ativo" && !!l.validoAte,
    vencendo: l => situacao(l) === "ativo" && l.validoAte && l.validoAte - Date.now() < 7 * DIA,
    vencida: l => situacao(l) === "vencida",
    bloqueado: l => situacao(l) === "bloqueado",
    reembolsada: l => situacao(l) === "reembolsada" || situacao(l) === "contestada"
  };
  FILTRO_FN = F[filtro] || null;
  $("stats").innerHTML = '<div class="resumo-total" role="button" tabindex="0"><b></b><span>licenças no total</span></div><div class="resumo-linha"></div>';
  const tot = $("stats").querySelector(".resumo-total"); tot.querySelector("b").textContent = dados.length; tot.setAttribute("aria-pressed", String(filtro === "todas"));
  tot.onclick = () => { filtro = "todas"; desenhar(); };
  const linha = $("stats").querySelector(".resumo-linha");
  [["ativo", "ativas"], ["pro", "Pro"], ["basico", "básico"], ["vitalicia", "vitalícias"], ["assinatura", "assinaturas"], ["vencendo", "vencendo em 7 dias", true], ["vencida", "vencidas"], ["bloqueado", "bloqueadas"], ["reembolsada", "reembolsadas"]]
    .forEach(([id, nome, alerta]) => { const n = dados.filter(F[id]).length; if (!n && filtro !== id && (id === "vencida" || id === "reembolsada")) return;
      const b = document.createElement("button"); b.type = "button"; if (alerta && n) b.className = "alerta"; b.disabled = !n && filtro !== id;
      b.setAttribute("aria-pressed", String(filtro === id)); const bb = document.createElement("b"); bb.textContent = n; b.append(bb, nome);
      b.onclick = () => { filtro = filtro === id ? "todas" : id; desenhar(); }; linha.appendChild(b); });

  const q = $("busca").value.trim().toLowerCase();
  const lista = dados.filter(l => {
    const s = situacao(l);
    if (FILTRO_FN && !FILTRO_FN(l)) return false;
    return !q || String(l.email).toLowerCase().includes(q) || String(l.nome).toLowerCase().includes(q);
  }).sort((a, b) => (b.data || 0) - (a.data || 0));
  $("lista").innerHTML = "";
  if (!lista.length){ const p = document.createElement("p"); p.className = "nota"; p.textContent = "Nenhuma licença encontrada."; $("lista").appendChild(p); }
  lista.forEach(l => {
    const s = situacao(l), c = document.createElement("div"); c.className = "card lic";
    const cab = document.createElement("div"); cab.className = "cab";
    cab.innerHTML = '<div><div class="nm"></div><div class="em"></div></div><span class="tag ' + s + '"></span>';
    cab.querySelector(".nm").textContent = l.nome || l.email;
    { const pr = document.createElement("span"); pr.className = "tag " + (l.pro ? "pro" : "basico"); pr.textContent = l.pro ? (l.cortesia ? "PRO cortesia" : l.proTipo === "teste" ? "PRO teste" : "PRO") : "BÁSICO"; cab.querySelector(".nm").append(" ", pr); }
    /* país do cliente (pelo cartão da Stripe): só aparece quando NÃO é do Brasil */
    if (l.pais && l.pais !== "BR"){ const pa = document.createElement("span"); pa.className = "tag pais"; pa.textContent = bandeira(l.pais) + " " + nomePais(l.pais); cab.querySelector(".nm").append(" ", pa); }
    cab.querySelector(".em").textContent = (l.nome ? l.email + " · " : "") + "código " + l.codigo;
    cab.querySelector(":scope > .tag").textContent = ({ativo: "Ativa", vencida: "Vencida", reembolsada: "Reembolsada", contestada: "Contestada"})[s] || "Bloqueada";
    const info = document.createElement("div"); info.className = "info";
    const datas = document.createElement("span"); datas.textContent = "Desde " + dataBR(l.data) + " · " + (l.validoAte ? "válida até " + dataBR(l.validoAte) : "vitalícia") + (l.proTipo && l.proAte ? " · " + l.proTipo + " até " + dataBR(l.proAte) : "") + (l.cancelado ? " · cancelou: " + l.cancelado : "");
    const ap = Number(l.aparelhos) || 0, aps = document.createElement("span"); aps.className = "aps" + (ap >= 2 ? " cheio" : ""); aps.title = ap + " de 2 aparelhos em uso";
    aps.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>';
    aps.append(ap + "/2");
    info.append(datas, aps);
    if (l.teste){ const fimT = l.teste + 7 * DIA, emCurso = Date.now() < fimT && l.proTipo === "teste";
      const t = document.createElement("div"); t.className = "teste-l" + (emCurso ? "" : " fim");
      t.textContent = "Teste grátis do Pro: " + dataBR(l.teste) + " a " + dataBR(fimT) + (emCurso ? " · em andamento (" + Math.max(0, Math.ceil((fimT - Date.now()) / DIA)) + " dias)" : l.testeFim === "ok" ? " · acabou, ficou no básico" : /^pro|^upgrade/.test(l.proTipo) ? " · acabou e assinou o Pro" : " · acabou");
      c.__teste = t; }
    const hl = document.createElement("div"); hl.className = "hist"; hl.hidden = true;
    const mais = document.createElement("span"); mais.className = "mais"; mais.textContent = "⋯"; mais.setAttribute("aria-hidden", "true");
    cab.querySelector(":scope > .tag").after(mais);
    /* segurar 0,6 s = excluir; toque normal = menu */
    let tSeg = null, segurou = false;
    const soltar = () => { clearTimeout(tSeg); c.classList.remove("segurando"); };
    c.addEventListener("pointerdown", () => { segurou = false; c.classList.add("segurando"); tSeg = setTimeout(() => { segurou = true; c.classList.remove("segurando"); if (navigator.vibrate) navigator.vibrate(30); menuLic(l, hl, true); }, 600); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => c.addEventListener(ev, soltar));
    c.addEventListener("contextmenu", e => e.preventDefault());
    c.addEventListener("click", e => { if (segurou){ segurou = false; return; } if (e.target.closest(".hist")) return; menuLic(l, hl, false); });
    const seta = document.createElement("button"); seta.type = "button"; seta.className = "seta-hist"; seta.setAttribute("aria-label", "Ver histórico"); seta.setAttribute("aria-expanded", "false");
    seta.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
    seta.addEventListener("pointerdown", e => e.stopPropagation());
    seta.onclick = e => { e.stopPropagation(); const abrir = hl.hidden; seta.setAttribute("aria-expanded", String(abrir)); if (abrir) verHistorico(l, hl); else hl.hidden = true; };
    c.append(cab, info); if (c.__teste) c.append(c.__teste); c.append(hl, seta); $("lista").appendChild(c);
  });
}

/* botão × de fechar em toda janela grande (antes só fechava tocando fora) */
function botaoX(d){ const x = document.createElement("button"); x.type = "button"; x.className = "ac-x"; x.setAttribute("aria-label", "Fechar"); x.textContent = "×"; x.onclick = () => d.close(); return x; }
function menuLic(l, hl, excluir){
  const d = $("dlgAcoes"), s = situacao(l);
  const svg = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICO[k] + '</svg>';
  const fechar = () => d.close();
  const rodar = async (fn, ok) => { fechar(); try{ const j = await fn(); if (j && j.ok === false) toast(j.erro || "Não deu certo"); else { toast(ok); await carregar(); } }catch(_){ toast("Sem conexão"); } };
  const item = (ico, txt, sub, fn, cls) => { const b = document.createElement("button"); b.type = "button"; b.className = "ac-item " + (cls || ""); b.innerHTML = svg(ico) + "<span></span>"; b.querySelector("span").textContent = txt; if (sub){ const sm = document.createElement("small"); sm.textContent = sub; b.querySelector("span").append(document.createElement("br"), sm); } b.onclick = fn; return b; };
  const div = t => { const e = document.createElement("div"); e.className = "ac-div"; e.textContent = t; return e; };
  const topo = document.createElement("div"); topo.className = "ac-topo"; topo.innerHTML = "<b></b><small></small>";
  topo.append(botaoX(d));
  topo.querySelector("b").textContent = l.nome || l.email; topo.querySelector("small").textContent = l.email + " · código " + l.codigo;
  const confirmarExcluir = () => {
    const cf = document.createElement("div"); cf.className = "ac-conf"; cf.innerHTML = "<b>Excluir esta licença?</b><p></p><div class=\"btns\"></div>";
    cf.querySelector("p").textContent = (l.nome || l.email) + " perde o acesso ao app. A linha vai para a aba Excluidas da planilha, então dá para recuperar se precisar.";
    const nao = document.createElement("button"); nao.className = "btn"; nao.textContent = "Cancelar"; nao.onclick = fechar;
    const sim = document.createElement("button"); sim.className = "btn vermelho"; sim.textContent = "Excluir";
    sim.onclick = () => rodar(() => api({acao: "admin_excluir", email: l.email}), "Licença excluída");
    cf.querySelector(".btns").append(nao, sim); d.replaceChildren(topo, cf);
  };
  if (excluir){ confirmarExcluir(); d.showModal(); return; }
  const corpo = document.createElement("div"); corpo.className = "ac-corpo";
  const grupo = (...xs) => { const g = document.createElement("div"); g.className = "ac-grupo"; g.append(...xs.filter(Boolean)); return g; };
  corpo.append(
    div("Acesso"), grupo(
    s === "bloqueado" ? item("ativ", "Desbloquear", "volta a funcionar na hora", () => rodar(() => api({acao: "admin_status", email: l.email, status: "ativo"}), "Desbloqueada"))
      : item("bloq", "Bloquear", "o app para de funcionar", () => rodar(() => api({acao: "admin_status", email: l.email, status: "bloqueado"}), "Bloqueada"), "perigo"),
    item("mais", "Dar mais 30 dias", l.validoAte ? "vale até " + dataBR(l.validoAte + 30 * DIA) : "", () => rodar(() => api({acao: "admin_validade", email: l.email, dias: 30}), "+30 dias")),
    l.validoAte ? item("infi", "Tornar vitalícia", "nunca vence", () => rodar(() => api({acao: "admin_validade", email: l.email, dias: 0}), "Agora é vitalícia")) : "",
    Number(l.aparelhos) ? item("cel", "Liberar aparelhos", l.aparelhos + " de 2 em uso", () => rodar(() => api({acao: "admin_liberar", email: l.email}), "Aparelhos liberados")) : ""),
    div("Pro"), grupo(
    item("pro", l.cortesia ? "Tirar o Pro cortesia" : "Dar Pro de cortesia", l.cortesia ? "volta ao plano que pagou" : "Pro de presente, sem cobrança", () => rodar(() => api({acao: "admin_pro", email: l.email, pro: l.cortesia ? "0" : "1"}), l.cortesia ? "Cortesia retirada" : "Pro de cortesia ligado"), l.cortesia ? "" : "ouro")),
    div("Código"), grupo(
    item("mail", "Reenviar o código por e-mail", "", () => rodar(() => api({acao: "admin_reenviar", email: l.email}), "E-mail reenviado")),
    item("cod", "Gerar código novo", "o antigo para de funcionar", () => {
      const cf = document.createElement("div"); cf.className = "ac-conf"; cf.innerHTML = "<b>Gerar um código novo?</b><p>O código atual para de funcionar e a pessoa recebe o novo por e-mail.</p><div class=\"btns\"></div>";
      const nao = document.createElement("button"); nao.className = "btn"; nao.textContent = "Cancelar"; nao.onclick = fechar;
      const sim = document.createElement("button"); sim.className = "btn ouro"; sim.textContent = "Gerar e enviar";
      sim.onclick = async () => { fechar(); try{ const j = await api({acao: "admin_novo_codigo", email: l.email, enviar: "1"}); if (j.ok){ toast("Novo código: " + j.codigo + " (enviado)"); await carregar(); } else toast(j.erro); }catch(_){ toast("Sem conexão"); } };
      cf.querySelector(".btns").append(nao, sim); d.replaceChildren(topo, cf); })),
    div("Suporte"), grupo(
    item("hist", "Ver passos no app", "o que a pessoa abriu e tocou (últimos 3 dias)", () => verPassos(l))),
    Object.assign(document.createElement("div"), {className: "ac-sep"}),
    item("lixo", "Excluir licença", "dá para recuperar na aba Excluidas", confirmarExcluir, "perigo"));
  d.replaceChildren(topo, corpo);
  d.onclick = e => { if (e.target === d) fechar(); };
  d.showModal();
}
/* passos no app (registro enviado pelo app: erros, relatar problema, 1x por dia) */
/* idioma do aparelho (vem junto com a tela, ex. "390x844 pl-PL"): bandeira + nome; fora do Brasil fica em destaque */
const bandeira = reg => /^[A-Z]{2}$/.test(reg) ? String.fromCodePoint(...[...reg].map(c => 127397 + c.charCodeAt(0))) : "🌐";
function nomePais(reg){ try{ return new Intl.DisplayNames(["pt-BR"], {type: "region"}).of(reg); }catch(_){ return reg; } }
function idiomaDe(tela){
  const cod = String(tela || "").split(" ")[1]; if (!cod) return null;
  const [lg, rg] = cod.split("-"), reg = (rg || ({pt: "BR", en: "US", es: "ES", pl: "PL", de: "DE", fr: "FR", it: "IT", ja: "JP"})[lg] || "").toUpperCase();
  const band = /^[A-Z]{2}$/.test(reg) ? String.fromCodePoint(...[...reg].map(c => 127397 + c.charCodeAt(0))) : "🌐";
  let nome = cod; try{ nome = new Intl.DisplayNames(["pt-BR"], {type: "language"}).of(lg); }catch(_){}
  const br = lg === "pt";
  return {br, txt: band + " Aparelho em " + nome + (br ? "" : " · a tela dele aparece traduzida; aqui os passos vêm em português")};
}
async function verPassos(l){
  const d = $("dlgAcoes");
  const cab = document.createElement("div"); cab.className = "ac-topo"; cab.innerHTML = "<b>Passos no app</b><small></small>"; cab.querySelector("small").textContent = l.email; cab.append(botaoX(d));
  const corpo = document.createElement("div"); corpo.className = "ac-corpo"; corpo.textContent = "Carregando…";
  d.replaceChildren(cab, corpo); if (!d.open) d.showModal();
  try{ const j = await api({acao: "admin_logs", email: l.email}); corpo.textContent = "";
    if (!j.ok || !j.envios.length){ corpo.textContent = "Nenhum registro nos últimos 3 dias. O app envia quando dá erro, quando a pessoa relata um problema e 1 vez por dia."; return; }
    j.envios.forEach(e => {
      const t = document.createElement("div"); t.className = "ac-div"; const idi = idiomaDe(e.tela); t.textContent = new Date(e.data).toLocaleString("pt-BR", {dateStyle: "short", timeStyle: "short"}) + " · " + e.motivo + " · v" + e.versao + " · " + String(e.tela || "").split(" ")[0]; corpo.appendChild(t);
      if (idi){ const b = document.createElement("div"); b.className = "idioma" + (idi.br ? "" : " fora"); b.textContent = idi.txt; corpo.appendChild(b); }
      let passos = []; try{ passos = JSON.parse(e.log); }catch(_){}
      const box = document.createElement("div"); box.className = "hist";
      passos.slice(-120).reverse().forEach(p => { const r = document.createElement("div"); r.className = "hist-l" + (p[1] === "ERRO" ? " erro" : "");
        const h = document.createElement("span"); h.textContent = new Date(p[0]).toLocaleString("pt-BR", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"});
        const b = document.createElement("b"); b.textContent = p[1]; const sm = document.createElement("small"); sm.textContent = p[2]; r.append(h, b, sm); box.appendChild(r); });
      corpo.appendChild(box);
    });
  }catch(_){ corpo.textContent = "Sem conexão."; }
}
async function verHistorico(l, hl){
  hl.hidden = false; hl.textContent = "Carregando…";
  try{ const j = await api({acao: "admin_historico", email: l.email});
    hl.textContent = "";
    if (!j.ok){ hl.textContent = j.erro || "Não deu para carregar."; return; }
    if (!j.historico.length){ hl.textContent = "Nada registrado ainda."; return; }
    j.historico.forEach(h => { const r = document.createElement("div"); r.className = "hist-l";
      const d = document.createElement("span"); d.textContent = h.data ? new Date(h.data).toLocaleString("pt-BR", {dateStyle: "short", timeStyle: "short"}) : "";
      const e = document.createElement("b"); e.textContent = h.evento;
      const x = document.createElement("small"); x.textContent = [h.detalhe, h.valor ? "valor " + h.valor : "", h.pedido ? "pedido " + h.pedido : ""].filter(Boolean).join(" · ");
      r.append(d, e, x); hl.appendChild(r); });
  }catch(_){ hl.textContent = "Sem conexão."; }
}
/* REEMBOLSOS: o cliente pede pelo app (Seu plano > Pedir reembolso). Devolver = a Stripe devolve no mesmo Pix ou cartão
   e a licença é cortada sozinha. "No prazo" = até 7 dias da compra (garantia); fora disso, você decide. */
let reembolsos = [];
async function carregarReemb(){
  try{ const j = await api({acao: "admin_reembolsos"}); if (!j.ok) return; reembolsos = j.pedidos || [];
    const n = reembolsos.filter(x => x.status === "pendente").length, b = $("abrirReemb");
    b.querySelector(".n") && b.querySelector(".n").remove();
    if (n){ const s = document.createElement("span"); s.className = "n"; s.textContent = n; b.appendChild(s); }
  }catch(_){}
}
function abrirReemb(){
  const d = $("dlgReemb"), fechar = () => d.close();
  const cab = document.createElement("div"); cab.className = "dlg-cab"; cab.innerHTML = '<h2>Reembolsos e motivos</h2><button class="fechar" aria-label="Fechar">×</button>'; cab.querySelector("button").onclick = fechar;
  const corpo = document.createElement("div"); corpo.style.cssText = "max-height:70vh;overflow:auto";
  if (!reembolsos.length){ const p = document.createElement("p"); p.className = "nota"; p.textContent = "Nenhum pedido de reembolso. Quando um cliente pedir pelo app (Seu plano > Pedir reembolso), aparece aqui e você recebe um e-mail. Devolver também cancela a assinatura daquele produto (a Stripe não cobra de novo) e a licença fica Reembolsada."; corpo.appendChild(p); }
  reembolsos.forEach(x => {
    const it = document.createElement("div"); it.className = "re-item";
    const t = document.createElement("b"); t.textContent = (x.nome || x.email); const st = document.createElement("span"); st.className = "re-st " + x.status; st.textContent = x.status; t.appendChild(st);
    const s1 = document.createElement("small"); s1.textContent = x.email + (x.produto ? " · " + x.produto : "");
    const s2 = document.createElement("small");
    s2.textContent = (x.valor ? "R$ " + Number(x.valor).toFixed(2).replace(".", ",") + " pago em " + dataBR(x.pagoEm) : "pagamento não encontrado") + " · pediu em " + dataBR(x.data);
    const pr = document.createElement("small"); pr.textContent = x.noPrazo ? "Dentro dos 7 dias da garantia" : "Fora do prazo de 7 dias: você decide"; if (!x.noPrazo) pr.className = "re-prazo";
    it.append(t, s1, s2, pr);
    if (x.motivo){ const m = document.createElement("p"); m.className = "re-mot"; m.textContent = "“" + x.motivo + "”"; it.appendChild(m); }
    if (x.status === "pendente"){
      const bs = document.createElement("div"); bs.className = "btns";
      const rec = document.createElement("button"); rec.className = "btn"; rec.textContent = "Recusar";
      const dev = document.createElement("button"); dev.className = "btn ouro"; dev.textContent = "Devolver " + (x.valor ? "R$ " + Number(x.valor).toFixed(2).replace(".", ",") : ""); dev.title = "Devolve o dinheiro pela Stripe e cancela a assinatura desse produto (não cobra de novo)";
      const agir = async (acao, ok, b) => {
        if (!b.dataset.ok){ b.dataset.ok = "1"; const t0 = b.textContent; b.textContent = "Toque de novo para confirmar"; setTimeout(() => { delete b.dataset.ok; b.textContent = t0; }, 4000); return; }
        rec.disabled = dev.disabled = true;
        try{ const j = await api({acao, linha: x.linha}); if (j.ok){ toast(ok); await carregarReemb(); abrirReemb(); carregar(); } else { toast(j.erro || "Não deu certo"); rec.disabled = dev.disabled = false; } }
        catch(_){ toast("Sem conexão"); rec.disabled = dev.disabled = false; }
      };
      rec.onclick = () => agir("admin_recusar_reemb", "Pedido recusado", rec);
      dev.onclick = () => agir("admin_reembolsar", "Dinheiro devolvido pela Stripe", dev);
      bs.append(rec, dev); it.appendChild(bs);
    } else if (x.resolvido){ const r = document.createElement("small"); r.textContent = (x.status === "devolvido" ? "Devolvido em " : "Recusado em ") + dataBR(x.resolvido); it.appendChild(r); }
    corpo.appendChild(it);
  });
  /* motivos de quem cancelou, pediu reembolso ou quase saiu */
  const mt = document.createElement("h3"); mt.textContent = "Motivos"; mt.style.cssText = "margin:18px 0 6px;font-size:1rem";
  corpo.appendChild(mt);
  const ml = document.createElement("div"); ml.className = "nota"; ml.textContent = "Carregando…"; corpo.appendChild(ml);
  const pinta = j => {
    ml.textContent = "";
    if (!j.ok || !j.itens.length){ ml.textContent = "Ninguém cancelou nem quase saiu ainda."; return; }
    j.itens.forEach(x => { const it = document.createElement("div"); it.className = "re-item";
      const t = document.createElement("b"); t.textContent = x.motivo || "(sem motivo)";
      const s1 = document.createElement("small"); s1.textContent = x.tipo + " · " + x.email + " · " + dataBR(x.data);
      it.append(t, s1); if (x.texto && x.texto !== x.motivo){ const p = document.createElement("p"); p.className = "re-mot"; p.textContent = "“" + x.texto + "”"; it.appendChild(p); }
      ml.appendChild(it); });
  };
  if (feedbacks) pinta(feedbacks);
  carregarFeedback().then(j => { if (j) pinta(j); }).catch(() => { if (!feedbacks) ml.textContent = "Sem conexão."; });
  d.replaceChildren(cab, corpo);
  d.onclick = e => { if (e.target === d) fechar(); };
  if (!d.open) d.showModal();
}
/* abre NA HORA com o que já foi carregado junto da lista; depois atualiza por trás */
let feedbacks = null;
async function carregarFeedback(){ const j = await api({acao: "admin_feedback"}); if (j && j.ok) feedbacks = j; return j; }
$("abrirReemb").onclick = () => { abrirReemb(); carregarReemb().then(() => { if ($("dlgReemb").open) abrirReemb(); }); };
$("busca").oninput = desenhar;
$("abrirNova").onclick = () => { $("dlgNova").showModal(); $("nNome").focus(); };
$("fecharNova").onclick = () => $("dlgNova").close();
$("criar").onclick = async () => {
  const email = $("nEmail").value.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast("Digite um e-mail válido"); return; }
  $("criar").disabled = true;
  try{ const j = await api({acao: "admin_criar", email, nome: $("nNome").value.trim(), dias: $("nPlano").value, enviar: $("nEnviar").checked ? "1" : "0"});
    if (j.ok){ toast("Licença criada: " + j.codigo); $("nEmail").value = ""; $("nNome").value = ""; $("dlgNova").close(); await carregar(); } else toast(j.erro); }
  catch(e){ toast("Sem conexão"); }
  $("criar").disabled = false;
};
