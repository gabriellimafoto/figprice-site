<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel · FigPrice</title>
<meta name="theme-color" content="#1a120d">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a120d;--card:#241912;--fundo:#130c08;--ink:#f1e9dd;--muted:#bfae99;--line:#4a382b;--ouro:#e2b54a;--verde:#6cc0b2;--vermelho:#e2584a;color-scheme:dark}
*{box-sizing:border-box}
html{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;font-size:16px;line-height:1.45;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
main{width:min(1200px,100% - 32px);margin:0 auto;padding:24px 0 60px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:1.8rem}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.login{max-width:420px;margin:60px auto}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--fundo);color:var(--ink);font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.ouro{background:var(--ouro);border-color:var(--ouro);color:#2a2420}
.btn.pq{min-height:34px;padding:5px 11px;font-size:.85rem}
.btn.perigo{color:var(--vermelho);border-color:var(--vermelho)}
.btn:disabled{opacity:.5}
.erro{color:var(--vermelho);min-height:1.2em;margin-top:10px}
.nota{color:var(--muted);font-size:.9rem}
.stats{margin-bottom:18px}
.resumo-total{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.resumo-total b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2.6rem;line-height:1}
.resumo-total span{color:var(--muted)}
.resumo-linha{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.resumo-linha span{background:var(--fundo);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:.9rem}
.resumo-linha span b{margin-right:4px}
.resumo-linha .alerta{border-color:var(--ouro);color:var(--ouro)}
.carregando{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
.barra input{flex:1;min-width:200px}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#11201e}
.lista{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
@media (max-width:420px){.lista{grid-template-columns:1fr}}
.lic{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.lic .cab{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.lic .cab > .tag{white-space:nowrap;flex:none}
.lic .cab > div{min-width:0}
.lic .nm{font-weight:700;font-size:1.05rem;line-height:1.25;word-break:break-word}
.lic .em{color:var(--muted);font-size:.8rem;word-break:break-all}
.lic .info{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:.82rem}
.aps{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink);white-space:nowrap}
.aps svg{width:14px;height:14px}
.aps.cheio{color:var(--ouro)}
.tag{display:inline-block;font-size:.75rem;font-weight:800;padding:3px 9px;border-radius:20px;background:#3a2a20;color:var(--muted)}
.hist{margin-top:10px;border-top:1px solid #4a382b;padding-top:8px;font-size:.85rem}
.hist-l{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:6px 0;border-bottom:1px dashed #3a2a20}
.hist-l span{color:#bfae99;grid-row:span 2}
.hist-l small{color:#bfae99}
.idioma{margin:6px 0 2px;font-size:.88rem;color:var(--muted)}
.idioma.fora{display:inline-block;padding:6px 10px;border-radius:10px;border:1px solid var(--ouro);color:var(--ouro);font-weight:700}
.hist-l.erro b,.hist-l.erro small{color:var(--vermelho,#e57373)}
.tag.pro{background:var(--ouro);color:#2a2420;vertical-align:2px}
.tag.pais{background:#1d3550;color:#cfe3ff;vertical-align:2px}
.tag.cupom{background:#3a2a10;color:#f3d48b;border:1px dashed #e2b54a;vertical-align:2px}
/* cartão de licença (13/11): posições fixas */
.lic .cab{display:block}
.lic .l1{display:flex;align-items:center;gap:8px;min-width:0}
.lic .l1 .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
.lic .l1 .selo{flex:none;white-space:nowrap}
.lic .l1 .selo.teste{background:transparent;color:var(--ouro);border:1.5px solid var(--ouro)}
.lic .l1 .mais{flex:none}
.lic .em{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
.lic .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;min-height:20px}
.tag.mini{font-size:.68rem;font-weight:700;padding:2px 8px;vertical-align:0}
.tag.mini.teste{background:#16302c;color:#bfeee5}
.lic .info .datas{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lic .info .cod{flex:none;font-family:ui-monospace,Consolas,monospace;font-size:.76rem;color:var(--muted);letter-spacing:.04em}
.cupons{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cupons h3{margin:0 0 8px;font-size:.72rem;color:var(--ouro);letter-spacing:.1em;text-transform:uppercase}
.cupons .cl{display:flex;flex-wrap:wrap;gap:8px}
.cupons button{display:inline-flex;align-items:baseline;gap:6px;background:var(--fundo);border:1px dashed #6b5634;border-radius:20px;padding:6px 12px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer}
.cupons button b{color:var(--ouro);font-family:"Bricolage Grotesque",system-ui,sans-serif}
.cupons button small{color:var(--muted)}
.cupons button[aria-pressed="true"]{border-style:solid;border-color:var(--verde);background:#16302c}
.cupons p{margin:6px 0 0;color:var(--muted);font-size:.8rem}
.tag.basico{background:#4a4540;color:#d8d2ca;vertical-align:2px}
.resumo-total{cursor:pointer;border-radius:12px;padding:2px 6px;margin:-2px -6px}
.resumo-total[aria-pressed="true"] span{color:var(--verde)}
.resumo-linha button{background:var(--fundo);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font:inherit;font-size:.9rem;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s}
.resumo-linha button b{margin-right:4px}
.resumo-linha button.alerta{border-color:var(--ouro);color:var(--ouro)}
.resumo-linha button[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#11201e}
.resumo-linha button:disabled{opacity:.45;cursor:default}
.lic{position:relative;padding-bottom:22px}
.seta-hist{position:absolute;right:8px;bottom:4px;width:30px;height:24px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:8px}
.seta-hist svg{width:18px;height:18px;transition:transform .25s}
.seta-hist[aria-expanded="true"] svg{transform:rotate(180deg)}
.seta-hist:hover{background:var(--fundo)}
.btn.ouro-l{color:var(--ouro);border-color:var(--ouro)}
.tag.ativo{background:#1f4a43;color:#bfeee5}.tag.bloqueado{background:#5a1f19;color:#ffc9c2}.tag.vencida{background:#5a4513;color:#f3d48b}.tag.reembolsada{background:#2a3550;color:#c3d3ff}.tag.contestada{background:#4a1f3f;color:#ffc2ec}
.lic{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .12s,border-color .2s}
.lic:active{transform:scale(.99)}
.lic.segurando{border-color:var(--vermelho);transition:border-color .5s}
.lic .mais{color:var(--muted);font-size:1.3rem;line-height:1;margin-left:4px}
.lista.velha{opacity:.45;pointer-events:none;filter:grayscale(.4);transition:opacity .2s}
.carregando{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:8px;width:max-content;margin:0 auto 10px;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--ouro);color:var(--ouro);font-weight:700;font-size:.88rem}
.carregando::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--ouro);border-top-color:transparent;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#dlgAcoes{padding:0;overflow:hidden}
.ac-topo{padding:18px 20px 10px;border-bottom:1px solid var(--line)}
.ac-topo b{display:block;font-size:1.05rem}.ac-topo small{color:var(--muted);word-break:break-all}
.ac-corpo{padding:6px 12px 14px;max-height:70vh;overflow:auto}
.ac-div{display:flex;align-items:center;gap:10px;margin:16px 6px 6px;color:var(--ouro);font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.ac-div::after{content:"";flex:1;height:1px;background:var(--line)}
.ac-div:first-child{margin-top:8px}
.ac-grupo{background:var(--fundo);border:1px solid var(--line);border-radius:14px;padding:2px}
.teste-l{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--verde)}
.teste-l.fim{color:var(--muted)}
#abrirReemb{position:relative}
#abrirReemb .n{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--vermelho);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center}
.re-item{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:var(--fundo)}
.re-item b{display:block}.re-item small{color:var(--muted);display:block}
.re-item .re-mot{margin:8px 0 0;font-size:.88rem}
.re-item .btns{display:flex;gap:8px;margin-top:10px}.re-item .btns .btn{flex:1}
.re-st{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:12px;margin-left:6px;vertical-align:2px}
.re-st.pendente{background:var(--ouro);color:#2a2420}.re-st.devolvido{background:var(--verde);color:#11201e}.re-st.recusado{background:#3a2a20;color:var(--muted)}
.re-prazo{color:var(--vermelho);font-weight:700}
.ac-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border:0;border-radius:12px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ac-item:hover,.ac-item:active{background:var(--fundo)}
.ac-item svg{width:20px;height:20px;flex:none;color:var(--muted)}
.ac-item span{flex:1}.ac-item small{color:var(--muted);font-size:.8rem}
.ac-item.ouro svg,.ac-item.ouro span{color:var(--ouro)}
.ac-item.perigo,.ac-item.perigo svg{color:var(--vermelho)}
.ac-sep{border-top:1px solid var(--line);margin:12px 0 4px}
.ac-conf{padding:18px 20px}
.ac-conf p{margin:6px 0 16px;color:var(--muted)}
.ac-conf .btns{display:flex;gap:8px}.ac-conf .btns .btn{flex:1}
.btn.vermelho{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.acoes{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.acoes .btn.pq{min-height:30px;padding:4px 10px;font-size:.8rem}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(440px,100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
html:has(dialog[open]),html:has(dialog[open]) body{overflow:hidden}
dialog,.ac-corpo{overscroll-behavior:contain}
.ac-topo{position:relative;padding-right:56px!important}
.ac-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--fundo);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.ac-x:hover{border-color:var(--ouro);color:var(--ouro)}
.dlg-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fechar{background:none;border:0;color:var(--muted);font-size:1.6rem;line-height:1;cursor:pointer;padding:4px 8px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:10px}
.check input{width:auto}
/* ===== 5.0: resumo ===== */
.dash-heroi{display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.dh-topo{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dash-heroi .dh-topo b{font-size:4.2rem;margin:0;color:var(--ouro)}
.dh-topo strong{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.5rem;line-height:1.1}
.dh-barra{display:flex;height:10px;border-radius:10px;overflow:hidden;background:#3a2a20;gap:2px}
.dh-barra i{display:block;min-width:0}
.dh-barra i.pro{background:linear-gradient(90deg,#c9952b,#f3d48b)}
.dh-barra i.bas{background:var(--verde)}
.dh-mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dh-mini div{background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;min-width:0}
.dash-heroi .dh-mini b{font-size:1.5rem;margin:0}
.dash-heroi .dh-mini span{display:block;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh-mini .pro b{color:var(--ouro)}.dh-mini .bas b{color:var(--verde)}.dh-mini .sai b{color:#ffcf9a}
.dash{margin-bottom:18px;display:grid;gap:12px}
.dash-topo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.dash-topo{grid-template-columns:1fr}}
.dash-heroi{text-align:left;background:linear-gradient(135deg,#2e2014,#241912);border:1px solid var(--ouro);border-radius:18px;padding:18px 20px;color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.dash-heroi small{display:block;color:var(--ouro);font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.dash-heroi b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:3.2rem;line-height:1.05;margin:4px 0}
.dash-heroi span{color:var(--muted);font-size:.92rem}
.dash-heroi[aria-pressed="true"],.dash-c[aria-pressed="true"]{outline:2px solid var(--verde);outline-offset:1px}
.dash-din{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.dash-din h3{margin:0 0 8px;font-size:.72rem;color:var(--ouro);letter-spacing:.1em;text-transform:uppercase}
.dash-din .l{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #3a2a20;font-size:.92rem}
.dash-din .l:last-of-type{border-bottom:0}
.dash-din .l span{color:var(--muted);min-width:0}
.dash-din .l b{white-space:nowrap}
.dash-din .l.liq b{color:var(--verde);font-size:1.1rem}
.dash-din p{margin:8px 0 0;color:var(--muted);font-size:.8rem}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dash-c{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer;min-width:0;transition:border-color .2s,transform .15s}
.dash-c:hover{border-color:var(--muted)}
.dash-c:active{transform:scale(.98)}
.dash-c:disabled{opacity:.45;cursor:default}
.dash-c b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.7rem;line-height:1.1}
.dash-c span{display:block;font-weight:700;font-size:.9rem}
.dash-c small{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}
.dash-c.alerta b{color:var(--ouro)}
.dash-c.ruim b{color:var(--vermelho)}
.dash-c.bom b{color:var(--verde)}
.dash-todas{background:none;border:0;color:var(--muted);font:inherit;font-size:.86rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;justify-self:start;padding:2px 0}
.tag.manual{background:#33303a;color:#d6cfee;vertical-align:2px}
.tag.cancelou{background:transparent;color:var(--muted);border:1px solid #4a4540;vertical-align:2px;font-weight:700}
.lic .cab > .tag.apagado{opacity:.4}
.abas-m{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.abas-m button{background:var(--fundo);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer}
.abas-m button[aria-selected="true"]{background:var(--ouro);border-color:var(--ouro);color:#2a2420;font-weight:700}
.abas-m button i{font-style:normal;opacity:.7;margin-left:4px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:8px 0;border-bottom:1px dashed #3a2a20;font-size:.9rem}
.ev time{color:var(--muted);font-size:.8rem;white-space:nowrap}
.ev .q{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .q small{color:var(--muted)}
.ev .v{white-space:nowrap;color:var(--muted)}
.ev .t{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:20px;background:#3a2a20;color:var(--muted);margin-right:6px}
.ev .t.compra,.ev .t.renovacao,.ev .t.reativou{background:#1f4a43;color:#bfeee5}
.ev .t.cancelou,.ev .t.atrasou{background:#4a2f1c;color:#ffcf9a}
.ev .t.reembolso,.ev .t.contestou{background:#4a1f1c;color:#ffb3aa}
.passos-info{margin:8px 6px 0;font-size:.84rem;color:var(--muted)}
.passos-info b{color:var(--verde)}
.passos-dia{position:sticky;top:0;background:var(--card);padding:8px 0 4px;margin-top:8px;color:var(--ouro);font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;z-index:1}
.ps{display:grid;grid-template-columns:62px minmax(0,1fr);gap:0 10px;padding:5px 0;border-bottom:1px dashed #33261c;font-size:.9rem}
.ps time{color:var(--muted);font-size:.78rem;padding-top:2px}
.ps span{min-width:0;overflow-wrap:anywhere}
.ps span i{font-style:normal;color:var(--muted)}
.ps.erro span{color:var(--vermelho)}
.ps.abriu span{color:var(--verde);font-weight:700}
.ps.tela span b{font-weight:700}
</style>
</head>
<body>
<main>
  <section id="telaLogin" class="login card">
    <h1>Painel FigPrice</h1>
    <p class="nota">Acesso só para o administrador. Um código de 6 números chega no seu e-mail.</p>
    <div id="passo1">
      <label for="lEmail">E-mail do administrador</label>
      <input id="lEmail" type="email" autocomplete="email" value="gbiel2008@hotmail.com">
      <button class="btn ouro" style="width:100%;margin-top:14px" id="pedir">Enviar código</button>
    </div>
    <div id="passo2" hidden>
      <label for="lCodigo">Código recebido no e-mail</label>
      <input id="lCodigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
      <label class="check"><input type="checkbox" id="lLembrar" checked> Lembrar este computador por 30 dias</label>
      <button class="btn ouro" style="width:100%;margin-top:14px" id="entrar">Entrar</button>
      <p class="nota">Não chegou? Olhe a caixa de spam.</p>
    </div>
    <p class="erro" id="lErro" role="alert"></p>
  </section>

  <section id="telaPainel" hidden>
    <div class="topo"><h1>Licenças</h1><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn ouro" id="abrirNova">+ Nova licença</button><button class="btn" id="abrirReemb">Movimento</button><button class="btn" id="atualizar">Atualizar</button><button class="btn" id="sair">Sair</button></div></div>
    <p class="carregando" id="carregando" hidden>Atualizando…</p>
    <div class="stats card" id="stats"></div>
    <dialog id="dlgNova">

<script>

const DIA = 864e5;
let token = localStorage.getItem("ff_admin") || sessionStorage.getItem("ff_admin"), dados = [], filtro = localStorage.getItem("ff_admin_filtro") || "todas";

const $ = id => document.getElementById(id);

async function api(params){
  const r = await fetch(API + "?" + new URLSearchParams(Object.assign({token: token || ""}, params)));
  const j = await r.json();
  if (j.sair){ esquecer(); mostrar(); }
  return j;
}
function mostrar(){
  $("telaLogin").hidden = !!token; $("telaPainel").hidden = !token;
  if (!token) return;
  try{ const c = JSON.parse(localStorage.getItem("ff_admin_cache") || "null"); if (Array.isArray(c) && !dados.length){ dados = c; desenhar(); } }catch(_){}

}

    if (j.ok){ $("passo1").hidden = true; $("passo2").hidden = false; $("lCodigo").focus(); } else $("lErro").textContent = j.erro; }
  catch(e){ $("lErro").textContent = "Sem conexão. Tente de novo."; }
  $("pedir").disabled = false;
};
$("entrar").onclick = async () => {
  $("lErro").textContent = "";

  try{ const j = await api({acao: "admin_entrar", codigo: $("lCodigo").value.trim(), lembrar: lembrar ? "1" : "0"});
    if (j.ok){ token = j.token; (lembrar ? localStorage : sessionStorage).setItem("ff_admin", token); mostrar(); } else $("lErro").textContent = j.erro; }
  catch(e){ $("lErro").textContent = "Sem conexão. Tente de novo."; }
};
$("lCodigo").onkeydown = e => { if (e.key === "Enter") $("entrar").click(); };

/* 13/11 (Gabriel): selo com o plano + a situação financeira. "cancelado" = cancelou a renovação E o prazo pago já acabou (está sem acesso);
   enquanto ainda tem dias pagos continua "ativo" com a etiqueta "renovação cancelada". */
function seloSituacao(l, s){
  const pro = l.cortesia || /^(pro|upgrade)/.test(String(l.proTipo || "")) || (l.pro && l.proTipo !== "teste");
  const plano = pro ? "Pro" : "Básico";
  if (s === "ativo") return (l.pro && l.proTipo !== "teste" ? "Pro" : "Básico") + " ativo"; /* agora: Pro que acabou e ficou no básico = Básico ativo */
  if (s === "reembolsada") return plano + " estornado";
  if (s === "contestada") return plano + " contestado";
  if (s === "vencida") return plano + (cancelouRenov(l) ? " cancelado" : " vencido");
  return plano + " bloqueado";
}
function situacao(l){
  const st = String(l.status).toLowerCase();
  if (st === "reembolsado") return "reembolsada"; /* v22: o motivo do bloqueio aparece no selo */
  if (st === "contestado") return "contestada";
  /* bloqueada à mão DEPOIS de um reembolso (antes da v29 o bloqueio apagava a marca): continua contando como reembolsada */
  if (st === "bloqueado" && ((resumo && resumo.eventos) || []).some(e => e.tipo === "reembolso" && String(e.email).toLowerCase() === String(l.email).toLowerCase())) return "reembolsada";
  if (st !== "ativo") return "bloqueado";
  if (l.validoAte && Date.now() > l.validoAte) return "vencida";
  return "ativo";
}
const dataBR = t => t ? new Date(t).toLocaleDateString("pt-BR") : "";
async function carregar(){
  $("carregando").hidden = false; if (dados.length) $("lista").classList.add("velha");
  try{ const j = await api({acao: "admin_listar"}); if (!j.ok){ toast(j.erro || "Erro ao carregar"); return; } dados = j.licencas; try{ localStorage.setItem("ff_admin_cache", JSON.stringify(dados)); }catch(_){} desenhar(); }
  catch(e){ toast("Sem conexão com a planilha"); }
  finally{ $("carregando").hidden = true; $("lista").classList.remove("velha"); carregarReemb(); carregarFeedback().catch(() => {}); carregarResumo(); }
}
/* (5.0) quem é quem. manual = criada no admin (pedido "painel") ou sem pedido de compra; pagante = ativa e veio de uma compra;
   assinante = pagante com prazo (mensal ou anual). Cortesia e teste nunca viram assinatura sozinhos. */
const manual = l => { const p = String(l.pedido || "").trim(); return !p || p === "painel" || p === "manual"; };
const pagante = l => situacao(l) === "ativo" && !manual(l);
const assinante = l => pagante(l) && !!l.validoAte;
const cancelouRenov = l => !!String(l.cancelado || "").trim();
const testando = l => situacao(l) === "ativo" && l.proTipo === "teste" && !!l.proAte && Date.now() < l.proAte;
const proPago = l => /^(pro|upgrade)/.test(String(l.proTipo || "")) && !!l.proAte && Date.now() < l.proAte;
/* quanto essa licença rende por mês se continuar renovando (anual dividido por 12). Renovação cancelada não conta. */
function receitaMensal(l){
  if (!assinante(l)) return 0;
  const canc = String(l.cancelado || "").split(","), tp = String(l.proTipo || ""); let v = 0;
  if (/^pro /.test(tp) && proPago(l)){ if (!canc.includes("pro")) v += /anual/.test(tp) ? 399 / 12 : 39.9; }
  else {
    if (!canc.includes("basico")) v += l.plano === "anual" ? 199 / 12 : 19.9;
    if (/^upgrade/.test(tp) && proPago(l) && !canc.includes("upgrade")) v += /anual/.test(tp) ? 200 / 12 : 20;
  }
  return v;
}
let resumo = null;
try{ resumo = JSON.parse(localStorage.getItem("ff_admin_resumo") || "null"); }catch(_){}
async function carregarResumo(){
  try{ const j = await api({acao: "admin_resumo"});
    if (j && j.ok){ resumo = j; try{ localStorage.setItem("ff_admin_resumo", JSON.stringify(j)); }catch(_){} desenhar(); if ($("dlgReemb").open) abrirReemb(); }
    else if (!resumo){ resumo = {v: 0, eventos: []}; }
  }catch(_){}
}
const FILTROS = [];

    assinante: assinante,
    cancelou: l => assinante(l) && cancelouRenov(l),
    reativou: l => reativaram.has(String(l.email).toLowerCase()),
    manual: l => situacao(l) === "ativo" && manual(l),
    comprada: l => pagante(l) && !l.validoAte && !l.cortesia,
    teste: testando,
    pro: l => !!l.pro && situacao(l) === "ativo",
    basico: l => !l.pro && situacao(l) === "ativo",
    vencendo: l => situacao(l) === "ativo" && l.validoAte && l.validoAte - Date.now() < 7 * DIA,

    bloqueado: l => situacao(l) === "bloqueado",

  /* cupons (script v28): filtro "cupom:CODIGO" mostra quem comprou com aquele cupom */
  const cupomDe = l => { const c = String(l.cupom || "").trim(); return c && c !== "-" && !/^di_/.test(c) ? c : ""; };
  if (/^cupom:/.test(filtro)){ const k = filtro.slice(6); F[filtro] = l => cupomDe(l).toLowerCase() === k.toLowerCase(); }
  if (!F[filtro]) filtro = "todas";
  FILTRO_FN = F[filtro] || null;
  const conta = id => dados.filter(F[id]).length;
  const ass = dados.filter(assinante), nPro = ass.filter(l => l.pro && l.proTipo !== "teste").length, nAnual = ass.filter(l => l.plano === "anual").length;
  const mensal = dados.reduce((t, l) => t + receitaMensal(l), 0);
  const R$ = v => "R$ " + Number(v || 0).toLocaleString("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const E = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  const hTopo = E("div", "dh-topo"); hTopo.append(E("b", "", String(ass.length)), E("strong", "", ass.length === 1 ? "assinante ativo" : "assinantes ativos"));
  const nBas = ass.length - nPro, hBarra = E("div", "dh-barra");
  if (ass.length){ const a = E("i", "pro"); a.style.flexGrow = nPro; const b = E("i", "bas"); b.style.flexGrow = nBas; hBarra.append(a, b); }

    if (dm.mes.devolvido) din.append(linhaD("Devolvido (reembolsos)", "− " + R$(dm.mes.devolvido)));
    din.append(linhaD("Líquido este mês", R$(dm.mes.liquido), "liq"));
    if (dm.anterior) din.append(linhaD("Líquido do mês passado", R$(dm.anterior.liquido)));
    din.append(E("p", "", "Estimada = soma dos planos de quem está com a renovação ligada (anual dividido por 12). Os outros valores vêm direto da Stripe."));

  const topo = E("div", "dash-topo"); topo.append(heroi, din);
  const grid = E("div", "dash-grid");
  const temResumo = !!(resumo && resumo.v);
  [["cancelou", "renovação cancelada", "usam até o fim do período pago", "alerta"],

   ["teste", "testando o Pro", "teste grátis de 7 dias", ""],
   ["manual", "cortesias e contas manuais", "criadas no admin: não são assinatura", ""],
   ["comprada", "vitalícias compradas", "compra antiga, sem mensalidade", ""],
   ["vencida", "vencidas", "passaram da validade", ""],
   ["bloqueado", "bloqueadas", "", ""]
  ].forEach(([id, nome, sub, cls]) => { const k = conta(id); if (!k && filtro !== id && ["comprada", "vencida", "bloqueado", "teste"].includes(id)) return;
    const b = E("button", "dash-c" + (k && cls ? " " + cls : "")); b.type = "button"; b.disabled = !k && filtro !== id; b.setAttribute("aria-pressed", String(filtro === id));
    b.append(E("b", "", id === "reativou" && !temResumo ? "–" : String(k)), E("span", "", nome)); if (sub) b.append(E("small", "", sub)); b.onclick = () => alternar(id); grid.appendChild(b); });

  /* QUADRO DE CUPONS: qual cupom (testador, indicação) trouxe mais gente. Conta todas as licenças que compraram com ele. */
  const porCupom = {};

  } else blocoCup.append(E("p", "", resumo && resumo.v >= 25 && dados.some(l => "cupom" in l) ? "Ninguém comprou com cupom ainda." : "Aparece aqui depois de atualizar o script para a v28."));

/* idioma do aparelho (vem junto com a tela, ex. "390x844 pl-PL"): bandeira + nome; fora do Brasil fica em destaque */
const bandeira = reg => /^[A-Z]{2}$/.test(reg) ? String.fromCodePoint(...[...reg].map(c => 127397 + c.charCodeAt(0))) : "🌐";
function nomePais(reg){ try{ return new Intl.DisplayNames(["pt-BR"], {type: "region"}).of(reg); }catch(_){ return reg; } }
function idiomaDe(tela){
  const cod = String(tela || "").split(" ")[1]; if (!cod) return null;
  const [lg, rg] = cod.split("-"), reg = (rg || ({pt: "BR", en: "US", es: "ES", pl: "PL", de: "DE", fr: "FR", it: "IT", ja: "JP"})[lg] || "").toUpperCase();
  const band = /^[A-Z]{2}$/.test(reg) ? String.fromCodePoint(...[...reg].map(c => 127397 + c.charCodeAt(0))) : "🌐";
  let nome = cod; try{ nome = new Intl.DisplayNames(["pt-BR"], {type: "language"}).of(lg); }catch(_){}
  const br = lg === "pt";
  return {br, txt: band + " Aparelho em " + nome + (br ? "" : " · a tela dele aparece traduzida; aqui os passos vêm em português")};
}
/* (5.0) PASSOS NO APP: uma linha do tempo só (junta todos os envios, sem repetir), em frases, mais novo em cima,

let passosTimer = null;
const PASSO_ROT = {toque: "Tocou em", tela: "Abriu a tela", popup: "Apareceu a janela", aviso: "Aviso na tela", abriu: "Abriu o app", rede: "Internet", drive: "Google Drive", oferta: "Oferta mostrada", precos: "Preços", ERRO: "ERRO"};

async function verPassos(l){
  const d = $("dlgAcoes"); clearInterval(passosTimer);
  const cab = document.createElement("div"); cab.className = "ac-topo"; cab.innerHTML = "<b>Passos no app</b><small></small>"; cab.querySelector("small").textContent = (l.nome ? l.nome + " · " : "") + l.email; cab.append(botaoX(d));
  const info = document.createElement("div"); info.className = "passos-info"; info.textContent = "Carregando…";
  const corpo = document.createElement("div"); corpo.className = "ac-corpo";
  d.replaceChildren(cab, info, corpo); if (!d.open) d.showModal();
  let assinatura = "";
  const pintar = j => {
    if (!j.ok || !j.envios.length){ info.textContent = ""; corpo.textContent = "Nenhum registro ainda. O app manda os passos a cada minuto de uso e quando a pessoa sai dele. Se ela ainda usa uma versão antiga (antes da 5.0), o envio é só 1 vez por dia: peça para fechar e abrir o app de novo para atualizar."; return; }
    const mapa = new Map();
    j.envios.forEach(e => { let ps = []; try{ ps = JSON.parse(e.log); }catch(_){} ps.forEach(p => { if (Array.isArray(p)) mapa.set(p[0] + "|" + p[1] + "|" + p[2], p); }); });
    const passos = [...mapa.values()].sort((a, b) => b[0] - a[0]).slice(0, 2000);
    const novo = j.envios[0], sig = passos.length + "|" + (passos[0] ? passos[0][0] : 0) + "|" + novo.data;

      if (dia !== diaAtual){ diaAtual = dia; const h = document.createElement("div"); h.className = "passos-dia"; h.textContent = dia === hoje ? "Hoje" : dia === ontem ? "Ontem" : dt.toLocaleDateString("pt-BR", {weekday: "long", day: "2-digit", month: "2-digit"}); corpo.appendChild(h); }

      const tm = document.createElement("time"); tm.textContent = dt.toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit", second: "2-digit"});
      const sp = document.createElement("span"), rot = document.createElement("i"); rot.textContent = (PASSO_ROT[p[1]] || p[1]) + (p[1] === "abriu" ? "" : ": ");
      const tx = document.createElement(p[1] === "tela" ? "b" : "span"); tx.textContent = p[1] === "abriu" ? " · " + passoTexto(p[2]) : passoTexto(p[2]);
      sp.append(rot, tx); r.append(tm, sp); corpo.appendChild(r);
    });
    corpo.scrollTop = rol;
  };
  const buscar = async () => { try{ pintar(await api({acao: "admin_logs", email: l.email})); }catch(_){ if (!assinatura) corpo.textContent = "Sem conexão."; } };
  await buscar();
  passosTimer = setInterval(() => { if (!d.open || !document.body.contains(corpo)){ clearInterval(passosTimer); return; } buscar(); }, 20000);
}

      corpo.appendChild(it); });
  }
  d.replaceChildren(cab, abas, corpo);
  d.onclick = e => { if (e.target === d) fechar(); };
  if (!d.open) d.showModal();
}
