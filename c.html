<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a120d">
<title>Catálogo de peças</title>
<meta property="og:title" content="Catálogo de peças">
<meta property="og:description" content="Veja as fotos das peças e peça o seu orçamento pelo WhatsApp.">
<meta property="og:image" content="https://figprice.com.br/og-catalogo.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:type" content="website"><meta property="og:site_name" content="FigPrice">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* FigPrice 6.16: catálogo que o estúdio compartilha com os clientes. Lê catalogo-publico.json do Google Drive do estúdio
   (arquivo aberto só para quem tem o link). Sem login, sem valores. */
:root{--bg:#1a120d;--surface:#241912;--line:#4a382b;--ink:#f1e9dd;--muted:#bfae99;--gold:#e2b54a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
header{padding:calc(30px + env(safe-area-inset-top,0px)) 16px 18px;text-align:center}
.lg{width:58px;height:58px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(226,181,74,.14);border:1px solid rgba(226,181,74,.45);color:var(--gold);font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.3rem}
h1{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-size:1.55rem;line-height:1.1;overflow-wrap:anywhere}
header p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 16px;max-width:1100px;margin:0 auto}
.g.dois{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:640px}
@media(min-width:600px){.g{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.g.dois{grid-template-columns:repeat(2,minmax(0,1fr))}}
.carr{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);transition:opacity .35s}
.carr.sai{opacity:0;pointer-events:none}
.carr .roda{margin:0}
.carr span{color:var(--muted);font-size:.9rem}
.aviso small{display:block;margin-top:14px;color:#7d6c5a;font-size:.72rem}
.aviso button{margin-top:18px;padding:12px 22px;border:0;border-radius:12px;background:var(--gold);color:#241808;font-weight:800;cursor:pointer}
.fw.carregando::before{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:g 1s linear infinite}
.c{position:relative;display:flex;flex-direction:column;min-width:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s;animation:e .45s cubic-bezier(.2,.8,.2,1) both}
.c:active{transform:scale(.97)}
@keyframes e{from{opacity:0;transform:translateY(12px) scale(.97)}}
.c .f{position:relative;aspect-ratio:1;background:rgba(255,255,255,.03)}
.c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.c img.ok{opacity:1}
.tg{position:absolute;left:6px;bottom:6px;padding:2px 7px;border-radius:20px;background:rgba(0,0,0,.62);color:#fff;font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.c .x{display:flex;flex-direction:column;padding:4px 6px 5px;min-width:0}
.c b{font-size:.78rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c small{color:var(--muted);font-size:.68rem;line-height:1.15}
footer{padding:22px 16px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:.74rem}
footer a{color:var(--gold);font-weight:800;text-decoration:none}
.aviso{max-width:420px;margin:18vh auto 0;padding:0 24px;text-align:center}
.aviso b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem;margin-bottom:8px}
.aviso span{color:var(--muted)}
.roda{width:34px;height:34px;margin:30vh auto 0;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:#0e0a07;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));animation:o .25s ease both}
@keyframes o{from{opacity:0}}
.ov .fe{align-self:flex-end;width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;cursor:pointer}
.meio{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.tk{display:flex;gap:12px;margin:0 -16px;padding:0 7%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tk::-webkit-scrollbar{display:none}
.sl{flex:0 0 86%;display:flex;align-items:center;justify-content:center;height:min(56vh,640px);scroll-snap-align:center}
.fw{position:relative;display:inline-flex;max-width:100%;max-height:100%;animation:z .35s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes z{from{transform:scale(.92);opacity:0}}
.fw img{display:block;max-width:100%;max-height:min(56vh,640px);width:auto;height:auto;border-radius:18px;background:rgba(255,255,255,.03);min-width:60px;min-height:60px}
.fw .tg{left:10px;bottom:10px;font-size:.66rem;padding:3px 9px}
.ct{position:absolute;top:10px;right:10px;padding:3px 9px;border-radius:20px;background:rgba(0,0,0,.6);color:#fff;font-size:.74rem;font-weight:800}
.dt{display:flex;justify-content:center;gap:7px;margin:16px 0 0;min-height:7px}
.dt i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .3s}
.dt i.on{width:22px;border-radius:4px;background:var(--gold)}
.ov h2{margin:14px 0 2px;text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem;overflow-wrap:anywhere}
.es{text-align:center;color:var(--muted);font-size:.95rem}
.zap{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;max-width:520px;margin:0 auto;padding:15px;border:0;border-radius:14px;background:var(--gold);color:#241808;font-weight:800;font-size:1rem;text-decoration:none;cursor:pointer}
.zap svg{width:20px;height:20px;fill:currentColor}
.nt{margin:10px 0 0;text-align:center;color:var(--muted);font-size:.78rem}
.seta{position:absolute;top:50%;width:42px;height:42px;margin-top:-21px;border-radius:50%;border:1px solid var(--line);background:rgba(36,25,18,.85);font-size:1.4rem;cursor:pointer;display:none}
@media (hover:hover) and (min-width:700px){.seta{display:block}}
.seta.esq{left:12px}.seta.dir{right:12px}
.tkw{position:relative}
</style>
</head>
<body>
<div id="app"><div class="roda" aria-label="Carregando"></div></div>
<script>
/* chave de API do Google (projeto figprice), travada para figprice.com.br e só para a Drive API */
const CHAVE = "AIzaSyBBhSENHJ5ugp4akSFRFXlsm9vM8fMfImo";
const ZAP = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.6-.3z"/></svg>';
const app = document.getElementById("app");
const HOSTS = ["www.googleapis.com", "content.googleapis.com"]; let hostBom = 0;
const arq = (id, h) => "https://" + HOSTS[h == null ? hostBom : h] + "/drive/v3/files/" + encodeURIComponent(id) + "?alt=media&key=" + CHAVE;
/* <img> que não carregou tenta o outro endereço uma vez */
function imgFoto(im, id, aoCarregar){ let vez = 0; im.onerror = () => { if (vez++ < 1) im.src = arq(id, 1 - hostBom); else if (aoCarregar) aoCarregar(false); }; im.onload = () => { if (aoCarregar) aoCarregar(true); }; im.src = arq(id); }
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const iniciais = n => (String(n || "").trim().split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join("") || "★").toUpperCase();
const LOG = "https://script.google.com/macros/s/AKfycbw4T6NZEemGmCQf1r_PoYeMVFq57wtigSd-XYc711VnBA5y58V0UBnkNgGv0e1bOqFixw/exec";
let nLog = 0;
function registrar(t){ if (!/(^|.)figprice.com.br$/.test(location.hostname) || nLog++ > 3) return; /* só o site de verdade (os testes não sujam os Logs) */ try{ navigator.sendBeacon(LOG, JSON.stringify({acao: "log_site", pagina: "/c", erro: String(t).slice(0, 700), ua: navigator.userAgent.slice(0, 120)})); }catch(_){} }
addEventListener("error", e => { if (e.filename && /figprice/.test(e.filename)) registrar((e.message || "erro") + " @" + (e.lineno || "")); });
function aviso(t, d, cod, tentar){ app.innerHTML = '<div class="aviso"><b>' + esc(t) + '</b><span>' + esc(d) + '</span>' + (tentar ? '<br><button type="button">Tentar de novo</button>' : '') + (cod ? '<small>código: ' + esc(cod) + '</small>' : '') + '</div>';
  const b = app.querySelector(".aviso button"); if (b) b.onclick = () => { app.innerHTML = '<div class="roda"></div>'; carregar(); }; }
async function buscar(url, ms){ const c = new AbortController(), t = setTimeout(() => c.abort(), ms); try{ return await fetch(url, {signal: c.signal, cache: "no-store"}); }finally{ clearTimeout(t); } }
const motivo = async r => { try{ const j = await r.clone().json(); const e = j && j.error; return r.status + " " + ((e && e.errors && e.errors[0] && e.errors[0].reason) || (e && e.message) || ""); }catch(_){ return String(r.status); } };
let cat = null;
async function carregar(){
  const id = decodeURIComponent(location.hash.slice(1)).replace(/[^\w-]/g, "");
  if (!id){ aviso("Link incompleto", "Peça o link do catálogo de novo para o estúdio."); return; }
  let erro = "", naoAchou = 0;
  const tentativas = [[0, 0, 12000], [1, 1200, 12000], [0, 3000, 15000], [1, 5000, 20000]]; /* [endereço, pausa antes, tempo máximo] */
  for (let vez = 0; vez < tentativas.length && !cat; vez++){
    const [h, pausa, ms] = tentativas[vez];
    if (pausa) await new Promise(ok => setTimeout(ok, pausa));
    try{
      const r = await buscar(arq(id, h), ms);
      const mot = r.ok ? "" : await motivo(r);
      if (r.status === 404 || (r.status === 403 && !/rateLimit|quota|dailyLimit|keyInvalid|referer|API_KEY|accessNotConfigured/i.test(mot))){
        if (++naoAchou >= 2){ registrar("catálogo indisponível " + mot + " " + id.slice(0, 6)); aviso("Este catálogo não está disponível", "O estúdio pode ter parado de compartilhar. Peça um link novo para ele."); return; }
        erro = mot; continue; } /* o Google às vezes diz "não encontrado" por um instante logo depois de o app atualizar o arquivo */
      if (!r.ok){ erro = mot; continue; }
      cat = await r.json(); hostBom = h;
    }catch(e){ erro = (e && e.name === "AbortError" ? "demorou demais" : String((e && e.message) || e)) + " (" + HOSTS[h] + ")"; }
  }
  if (cat && erro) registrar("abriu depois de falhar: " + erro + " " + id.slice(0, 6)); /* para acompanhar se as falhas passageiras continuam */
  if (!cat){ registrar("não abriu o catálogo: " + erro + " " + id.slice(0, 6)); aviso("Não deu para abrir o catálogo", "O Google demorou para responder. Tente de novo em instantes.", erro, true); return; }
  const pecas = (cat.pecas || []).filter(p => p && p.f && p.f.length);
  document.title = (cat.estudio ? cat.estudio + " · " : "") + "Catálogo de peças";
  if (!pecas.length){ aviso(cat.estudio || "Catálogo", "Ainda não há peças com foto neste catálogo."); return; }
  const carr = document.createElement("div"); carr.className = "carr"; carr.innerHTML = '<div class="roda"></div><span>Carregando o catálogo…</span>'; document.body.append(carr);
  app.innerHTML = '<header><div class="lg">' + esc(iniciais(cat.estudio)) + '</div><h1>' + esc(cat.estudio || "Catálogo de peças") + '</h1><p>Toque numa peça para ver as fotos</p></header><div class="g"></div>'
    + '<footer>Catálogo feito com <a href="https://figprice.com.br/" target="_blank" rel="noopener">FigPrice</a></footer>';
  const g = app.querySelector(".g"); if (pecas.length <= 4) g.classList.add("dois");
  const prontas = [];
  pecas.forEach((p, i) => {
    const c = document.createElement("button"); c.className = "c"; c.type = "button"; c.style.animationDelay = Math.min(i, 18) * .04 + "s";
    c.innerHTML = '<div class="f"><img alt="" loading="lazy">' + (p.f[0].r ? '<span class="tg">render</span>' : '') + '</div><div class="x"><b>' + esc(p.n) + '</b><small>' + esc(p.e) + '</small></div>';
    const im = c.querySelector("img"); im.loading = i < 12 ? "eager" : "lazy";
    prontas.push(new Promise(ok => { const fim = deu => { if (deu) im.classList.add("ok"); else registrar("miniatura não carregou " + i); ok(); };
      if (p.f[0].t){ im.onload = () => fim(true); im.onerror = () => imgFoto(im, p.f[0].m, fim); im.src = p.f[0].t; } else imgFoto(im, p.f[0].m, fim); }));
    c.onclick = () => abrir(p); g.append(c);
  });
  /* espera as primeiras miniaturas (no máximo 8 s) e mostra tudo de uma vez */
  await Promise.race([Promise.all(prontas.slice(0, 12)), new Promise(ok => setTimeout(ok, 8000))]);
  carr.classList.add("sai"); setTimeout(() => carr.remove(), 400);
  /* depois, baixa as fotos grandes por trás, uma de cada vez, na ordem das peças */
  (async () => { for (const p of pecas.slice(0, 24)){ await new Promise(ok => { const x = new Image(); x.onload = x.onerror = ok; x.src = arq(p.f[0].g); setTimeout(ok, 15000); }); } })(); /* só a foto principal; as outras quando abrir a peça */
}
function abrir(p){
  const n = p.f.length, ov = document.createElement("div"); ov.className = "ov"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true");
  const fone = String(cat.zap || "").replace(/\D/g, ""), num = fone ? (fone.length <= 11 ? "55" : "") + fone : "";
  const msg = "Oi! Vi " + (p.n ? "o " + p.n + (p.e ? " " + p.e : "") : "uma peça") + " no seu catálogo e queria um orçamento.";
  ov.innerHTML = '<button class="fe" type="button" aria-label="Fechar">×</button><div class="meio"><div class="tkw"><div class="tk">'
    + p.f.map((f, k) => '<div class="sl"><div class="fw carregando"><img alt="" data-id="' + esc(f.g) + '">' + (n > 1 ? '<span class="ct">' + (k + 1) + ' / ' + n + '</span>' : '') + (f.r ? '<span class="tg">render</span>' : '') + '</div></div>').join("")
    + '</div>' + (n > 1 ? '<button class="seta esq" type="button" aria-label="Foto anterior">‹</button><button class="seta dir" type="button" aria-label="Próxima foto">›</button>' : '') + '</div>'
    + '<div class="dt">' + (n > 1 ? p.f.map((_, k) => '<i' + (k ? '' : ' class="on"') + '></i>').join("") : '') + '</div>'
    + '<h2>' + esc(p.n) + '</h2><div class="es">' + (p.e ? 'escala ' + esc(p.e) : '') + '</div></div>'
    + (num ? '<a class="zap" href="https://wa.me/' + num + '?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener">' + ZAP + 'Quero orçar essa peça</a><p class="nt">Abre o WhatsApp ' + (cat.estudio ? 'do ' + esc(cat.estudio) : 'do estúdio') + '</p>' : '');
  document.body.append(ov); document.body.style.overflow = "hidden";
  ov.querySelectorAll(".fw img[data-id]").forEach(im => imgFoto(im, im.dataset.id, () => im.parentNode.classList.remove("carregando")));
  const tk = ov.querySelector(".tk"), dots = [...ov.querySelectorAll(".dt i")];
  const atual = () => Math.round(tk.scrollLeft / (tk.querySelector(".sl").offsetWidth + 12));
  tk.addEventListener("scroll", () => { const k = atual(); dots.forEach((d, j) => d.classList.toggle("on", j === k)); }, {passive: true});
  const ir = d => { const w = tk.querySelector(".sl").offsetWidth + 12; tk.scrollTo({left: Math.max(0, Math.min(n - 1, atual() + d)) * w, behavior: "smooth"}); };
  const e = ov.querySelector(".seta.esq"), dd = ov.querySelector(".seta.dir"); if (e){ e.onclick = () => ir(-1); dd.onclick = () => ir(1); }
  const fechar = () => { ov.remove(); document.body.style.overflow = ""; removeEventListener("keydown", tecla); };
  const tecla = ev => { if (ev.key === "Escape"){ if (history.state && history.state.peca) history.back(); else fechar(); } if (ev.key === "ArrowRight") ir(1); if (ev.key === "ArrowLeft") ir(-1); };
  addEventListener("keydown", tecla);
  /* o "voltar" do celular fecha a peça em vez de sair do catálogo */
  history.pushState({peca: 1}, "", location.href);
  const aoVoltar = () => { removeEventListener("popstate", aoVoltar); fechar(); };
  addEventListener("popstate", aoVoltar);
  ov.querySelector(".fe").onclick = () => history.back();
}
addEventListener("hashchange", () => { if (!document.querySelector(".ov")) carregar(); });
carregar();
</script>
</body>
</html>
